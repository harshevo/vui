[workspace]
resolver = "3"
members = [
    "crates/vui",
    "crates/vui-core",
    "crates/vui-render",
    "crates/vui-widgets",
    "examples/gallery",
]

[workspace.dependencies]
wgpu = "30.0.1"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
png = "0.18"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Shaping, rasterising and image resizing are slow in an unoptimised build, so
# dependencies are optimised even in dev and test profiles.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
