[workspace]
resolver = "3"
members = [
    "crates/vui",
    "crates/vui-core",
    "crates/vui-fonts",
    "crates/vui-icons",
    "crates/vui-macos",
    "crates/vui-render",
    "crates/vui-runtime",
    "crates/vui-viz",
    "crates/vui-widgets",
    "examples/gallery",
]

[workspace.dependencies]
wgpu = "30.0.1"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
png = "0.18"
cosmic-text = "0.19"
glyphon = "0.12"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
authors = ["Harsh Mishra"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/harshevo/vui"
keywords = ["gui", "ui", "widgets", "wgpu", "gpu"]
categories = ["gui", "graphics", "rendering"]

# One set of lints for every crate; each opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

# Shaping, rasterising and image resizing are slow in an unoptimised build, so
# dependencies are optimised even in dev and test profiles.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
