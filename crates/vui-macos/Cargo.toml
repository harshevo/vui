[package]
name = "vui-macos"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The macOS backend for vui: an AppKit window, its Metal surface, input, text input, the pasteboard and frame timing."

[dependencies]
vui-core = { path = "../vui-core" }
vui-render = { path = "../vui-render" }
vui-runtime = { path = "../vui-runtime" }
wgpu.workspace = true
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-quartz-core = "0.3.2"
